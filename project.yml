name: Silicium
options:
  bundleIdPrefix: com.silicium
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  SiliciumKit:
    path: SiliciumKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
targets:
  Silicium:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: SiliciumKit
        product: SiliciumShared
      - package: SiliciumKit
        product: SiliciumSensors
      - package: SiliciumKit
        product: SiliciumCore
      - package: SiliciumKit
        product: SiliciumStorage
      - package: SiliciumKit
        product: SiliciumUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silicium.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Silicium.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Silicium
schemes:
  Silicium:
    build:
      targets:
        Silicium: all
    run:
      config: Debug
    test:
      config: Debug
